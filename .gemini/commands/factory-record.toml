description = "Record a rich factory-metrics observation for a praxis artifact (skill, agent, workflow, command) — what worked, what didn't, what should change before steward review."

prompt = """
You are recording a factory-metrics observation — the rich, human-authored complement to the auto-stub entries hooks write. Those tell us *something happened*; this tells us *what happened and what we learned*.

1. Identify the artifact: type (skill | agent | workflow | command | hook | gate | reference) and name. If a specific praxis artifact was just used in this session, propose it as the default and confirm.

2. Capture the observation (skip anything the user already said; quality > completeness):
   - What happened? What was the artifact being used for?
   - What worked as designed?
   - Friction — where was it clunky, ambiguous, slow, or worked around?
   - Edge cases the artifact didn't anticipate?
   - Suggested refinements?

3. Optional context if known: slice id, outcome (success / failure / partial), rough duration.

4. Write the observation to a temp file with sections (## What worked / ## Friction / ## Edge cases / ## Suggested refinements) and invoke the recorder:

   scripts/factory-record.sh --type {type} --name {name} --tool gemini-cli --trigger slash-command --invocation read --outcome {outcome or null} --slice {slice or empty} --duration {seconds or empty} --observation "$OBS" --mode per-use

5. Confirm: show the written path and ask whether to record another observation. The aging report (scripts/factory-aging.sh) surfaces entries to the System Steward at quarterly review.

Notes: never write secrets, customer data, or PII — telemetry files commit to git. Skip this command for routine captures the hooks already handle; use it when you have something substantive to say. For experimental skills, record after every meaningful use.
"""
