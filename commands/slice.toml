description = "Run one implementation slice end-to-end via implementation-slice.yaml workflow."

prompt = """
Run `implementation-slice.yaml` workflow for the next slice in the phase roadmap.

If the slice is unspecified, ask me which one. Show me the slice's:
- Acceptance criteria
- Estimated size (must be 2-5 days; if larger, decompose first)
- Stack(s) involved
- Dependencies on prior slices

Then activate the appropriate specialist agent per the slice domain:
- Backend slice → backend-developer
- Frontend slice → frontend-developer
- Data slice → data-engineer (has_data_plane must be true)
- ML/Agentic slice → ml-ai-engineer (has_ml or has_agentic_ai must be true)

The specialist runs the AOP (Understand → Clarify → Plan → Execute → Validate → Document → Hand-off), consuming:
- Stack pack (stack-java-spring | stack-node-ts | stack-python | stack-web-frontend)
- `secure-coding`
- `testing-strategy`
- `observability`
- Domain-specific SKILLs per the slice

Then in order:
- Code Reviewer runs (per `code-review`). Stop at gate for my approval.
- Security Reviewer runs (per `secure-coding` + slice-specific security SKILLs). Stop at gate.
- QA Engineer runs (per `testing-strategy`). Stop at acceptance check.

Slice DoD: all gates green + acceptance met + artifacts in `.project/`.

Common rationalizations to ignore:
- "Slice is small; I'll skip the review gate." → small ≠ skip. All gates fire.
- "I'll add tests later." → DoD requires tests. Now.
- "We can ship without observability." → DoD requires SLO + dashboards + alerts for new surfaces.
"""
