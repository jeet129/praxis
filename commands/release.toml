description = "Production release: assemble evidence, route through production_go_live gate, deploy."

prompt = """
Run `production-release.yaml` workflow for the next release.

Ask me the release SHA (or use HEAD if just stated).

Assemble the production_go_live evidence pack per `governance/governance.yaml`:

ALWAYS REQUIRED (Wave 3 baseline):
1. All pre-prod gates cleared (Code Review + Security Review + QA + staging verification).
2. DR drill recent pass (per reliability-dr cadence).
3. Capacity sizing verified (per capacity-resource-estimation).
4. SLO observability live (per observability — SLOs, dashboards, alerts).
5. Rollback plan documented (per deploy-release — triggers + procedure).

CONDITIONAL (Wave 4 additions; evaluate per charter flags + change characteristics):
6. Chaos engineering pass recent — if resilience-critical change OR multi-AZ-region.
7. Performance test soak pass — if NFR-bearing change (latency / throughput / availability).
8. Compliance evidence complete — if any regulated regime applies.
9. Threat model updated — if architecture or trust-boundary change.
10. Supply chain attestation verified — ALWAYS (SBOM + SLSA provenance).

If `has_ml` or `has_agentic_ai`: also assemble `responsible_ai_review` evidence pack (5 always + 5 conditional items).

Show me the assembled pack with each item shown explicitly. I review; approve or send back.

On approval: production_deploy executes; release record archived to `.project/operational/releases/`; release notes generated per `technical-documentation`.

Common rationalizations to ignore:
- "Small release; skip chaos." → chaos cadence is windowed (90 days); not per-release. Verify the latest pass is within window.
- "Rollback is just revert." → must be documented per `deploy-release`. Trigger criteria + procedure + rehearsal date.
"""
