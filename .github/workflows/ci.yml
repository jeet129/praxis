name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Shell syntax check (scripts/*.sh)
        run: |
          set -e
          for f in scripts/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: Validate skills (structure + line budget)
        run: bash scripts/validate-skills.sh

      - name: Validate manifests
        run: bash scripts/validate-manifests.sh

      - name: Validate model routing (--check)
        run: python3 scripts/apply-model-routing.py --check

      - name: Build registry (--check)
        run: python3 scripts/build-registry.py --check

      - name: Validate workflows
        run: python3 scripts/validate-workflows.py

      - name: Validate references
        run: python3 scripts/validate-references.py

      - name: Validate reviewer coverage (security/quality skills a reviewer must load)
        run: python3 scripts/validate-review-coverage.py

      - name: Factory routing report smoke test (fail-soft on repos with no telemetry)
        run: python3 scripts/factory-routing-report.py --project-dir . --format json --out /tmp/ci-report.json

      - name: Factory usage report smoke test (fail-soft on repos with no telemetry)
        run: python3 scripts/factory-usage-report.py --project-dir . --format json --out /tmp/ci-usage.json

      - name: Factory token report smoke test (fail-soft on runners with no Claude Code transcript history)
        run: python3 scripts/factory-token-report.py --project-dir . --format json --out /tmp/ci-tokens.json

      - name: Drive runner dry-run smoke test (scripts/praxis-drive.sh)
        run: |
          set -e
          FIXTURE=/tmp/drive-test
          rm -rf "$FIXTURE"
          mkdir -p "$FIXTURE/.project/working"
          cat > "$FIXTURE/.project/working/slice-T1-tasks.yaml" <<'EOF'
          slice: T1
          packet: .project/working/slice-T1-packet.md
          opened: 2026-07-10
          tasks:
            - id: T1-1
              summary: "CI fixture task"
              agent: backend-developer
              tier: standard
              ac:
                - "placeholder"
              verify: "true"
              depends_on: []
              status: open
              attempts: 0
              notes: ""
          gates:
            code_review: pending
            security_review: n/a
            qa: pending
          state: open
          stop_flags: []
          EOF

          set +e
          bash scripts/praxis-drive.sh --project-dir "$FIXTURE" --dry-run --max-iterations 1
          rc=$?
          set -e

          echo "praxis-drive.sh exit code: $rc"
          # A single-iteration dry-run always hits the run-budget cap on the
          # next loop check (no harness actually ran to advance the ledger),
          # which is exit 4 (run_budget). Any other exit code is a regression.
          if [ "$rc" -ne 4 ]; then
            echo "ERROR: expected exit code 4 (run budget reached), got $rc"
            exit 1
          fi

          if [ ! -f "$FIXTURE/.project/telemetry/drive.jsonl" ]; then
            echo "ERROR: $FIXTURE/.project/telemetry/drive.jsonl was not created"
            exit 1
          fi

          lines=$(wc -l < "$FIXTURE/.project/telemetry/drive.jsonl")
          if [ "$lines" -lt 1 ]; then
            echo "ERROR: drive.jsonl has no telemetry records"
            exit 1
          fi
          echo "OK: drive.jsonl has $lines record(s)"

      - name: Workflow-drive smoke test (scripts/praxis-drive.sh --workflow)
        run: |
          set -e
          FIXTURE=/tmp/drive-workflow-test
          rm -rf "$FIXTURE"
          mkdir -p "$FIXTURE/.project/working"
          # A phase step whose artifact_exists exit is ALREADY satisfied
          # (the fixture file exists before the run), followed by a
          # governance gate. Exercises: machine-exit evaluation, status ->
          # done + completed_at stamping, then the ALWAYS-a-human-stop gate.
          echo "fixture artifact" > "$FIXTURE/.project/working/artifact.md"
          cat > "$FIXTURE/.project/working/workflow-state.yaml" <<'EOF'
          workflow: ci-fixture-workflow
          instance_of: workflows/fixture.yaml
          opened: 2026-07-16
          autonomy_zone: [C, D]
          steps:
            - id: WF-C1
              phase: C
              kind: phase
              agent: delivery-lead
              tier: standard
              depends_on: []
              outputs: [.project/working/artifact.md]
              exit:
                check: artifact_exists
                args: {path: .project/working/artifact.md}
              status: open
            - id: GATE-PROD
              phase: D
              kind: gate
              gate: production_go_live
              depends_on: [WF-C1]
              status: open
          state: open
          stop_flags: []
          EOF

          set +e
          bash scripts/praxis-drive.sh --project-dir "$FIXTURE" --workflow --dry-run --max-iterations 2
          rc=$?
          set -e

          echo "praxis-drive.sh --workflow exit code: $rc"
          # WF-C1's exit is already satisfied on disk, so the loop advances
          # it to done, then reaches GATE-PROD -> gate_reached, a natural
          # (exit 0) stop. Any other exit code is a regression.
          if [ "$rc" -ne 0 ]; then
            echo "ERROR: expected exit code 0 (gate_reached), got $rc"
            exit 1
          fi

          if [ ! -f "$FIXTURE/.project/telemetry/drive.jsonl" ]; then
            echo "ERROR: $FIXTURE/.project/telemetry/drive.jsonl was not created"
            exit 1
          fi

          if ! grep -q '"mode": "workflow"' "$FIXTURE/.project/telemetry/drive.jsonl"; then
            echo "ERROR: drive.jsonl has no mode:\"workflow\" record"
            cat "$FIXTURE/.project/telemetry/drive.jsonl"
            exit 1
          fi
          echo "OK: drive.jsonl has a mode:\"workflow\" record"

      - name: Executable bits present on scripts and hooks
        run: |
          set -e
          fail=0
          for f in install.sh try-as-plugin.sh scripts/*.sh scripts/*.py hooks/*.sh .githooks/pre-commit; do
            [ -e "$f" ] || continue
            if [ ! -x "$f" ]; then echo "NOT EXECUTABLE: $f"; fail=1; fi
          done
          exit $fail

      - name: Codex plugin package is fresh (rebuild must produce no diff)
        run: |
          set -e
          bash scripts/build-codex-plugin.sh
          if ! git diff --quiet plugins/praxis-codex/; then
            echo "ERROR: plugins/praxis-codex/ is stale — run scripts/build-codex-plugin.sh and commit the result."
            git diff --stat plugins/praxis-codex/ | tail -20
            exit 1
          fi
          bash scripts/validate-codex-plugin.sh

      - name: Command copies in sync (root commands/ vs .claude/ and .gemini/)
        run: |
          set -e
          fail=0
          for f in commands/*.md; do
            b=$(basename "$f")
            if [ -f ".claude/commands/$b" ] && ! diff -q "$f" ".claude/commands/$b" > /dev/null; then
              echo "DRIFT: .claude/commands/$b differs from commands/$b"; fail=1
            fi
          done
          for f in commands/*.toml; do
            b=$(basename "$f")
            if [ -f ".gemini/commands/$b" ] && ! diff -q "$f" ".gemini/commands/$b" > /dev/null; then
              echo "DRIFT: .gemini/commands/$b differs from commands/$b"; fail=1
            fi
          done
          exit $fail

      - name: Telemetry path consistency (single source of truth)
        run: |
          set -e
          # The only sanctioned routing-log path is .project/telemetry/model-routing.jsonl.
          if grep -rn "model-routing-log\.yaml\|working/model-routing" \
               --include="*.md" --include="*.yaml" --include="*.sh" --include="*.py" \
               agents/ skills/ commands/ docs/ governance/ hooks/ scripts/ README.md PLAYBOOK.md INSTALLATION.md 2>/dev/null; then
            echo "ERROR: stale model-routing log path found (use .project/telemetry/model-routing.jsonl)."
            exit 1
          fi

      - name: Installer references resolve (files install.sh copies must exist)
        run: |
          set -e
          # Every quoted repo path that install.sh copies must exist.
          fail=0
          for p in $(grep -oE '"\$LIBRARY_ROOT/[^"]+"' install.sh | sed 's|"\$LIBRARY_ROOT/||; s|"$||' | sort -u); do
            case "$p" in *'$'*) continue;; esac   # skip paths built from shell variables
            if [ ! -e "$p" ]; then echo "MISSING (referenced by install.sh): $p"; fail=1; fi
          done
          exit $fail
